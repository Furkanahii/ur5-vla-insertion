name: CPU checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-test.txt
      - name: Motion, replay and episode contract
        run: python -m unittest discover -s ur5-pilot -p 'test_*.py' -v
      - name: Task geometry and frozen splits
        run: python -m unittest discover -s rigid-insertion -p 'test_*.py' -v
        env:
          PYTHONPATH: ur5-pilot
      - name: Training-only normalization
        run: python -m unittest discover -s data-adapter -p 'test_*.py' -v
